<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="off.docTitle">Offline — ScoutMind</title>
<meta name="theme-color" content="#0F141B">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Theme (design spec v1.2), before any stylesheet: the same script as index.html. -->
<script>
(function(){
  var DEFAULT='system';                                 // 4b-8: no saved choice follows the device
  var root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  function pref(){ try{ var s=localStorage.getItem('sm_theme'); return s==='light'||s==='dark'||s==='system'?s:DEFAULT; }catch(e){ return DEFAULT; } }
  function resolve(p){ return p==='system'?(mq&&mq.matches?'dark':'light'):p; }
  function apply(){
    var t=resolve(pref());
    root.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content',t==='dark'?'#0F141B':'#F6F7F9');
  }
  apply();
  if(mq&&mq.addEventListener) mq.addEventListener('change',function(){ if(pref()==='system') apply(); });
})();
</script>
<link rel="stylesheet" href="/theme.css?v=3994ef967c">
<link href="/vendor/fonts/fonts.css" rel="stylesheet">
<!-- Shown by sw.js when a page is requested offline and no copy of it is
     cached yet. Everything it needs is in the precache, i18n.js included:
     the page speaks the reader's language (the device's until they choose). -->
<script src="/i18n.js?v=167b7042bf"></script>
<style>
/* 4b-7: on the v1.2 tokens (/theme.css). No literal colours (tests/theme.test.js). */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.logo{font-family:var(--font-num);font-weight:700;font-size:30px;letter-spacing:0.5px;color:var(--navy-ink);margin-bottom:22px;}
.logo span{color:var(--ink);}
h1{font-size:18px;font-weight:600;margin-bottom:8px;}
p{font-size:14px;color:var(--muted);line-height:1.6;max-width:320px;margin:0 auto 20px;}
button{min-height:44px;padding:0 22px;border-radius:22px;border:none;background:var(--navy);color:var(--on-navy);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
button:hover{background:var(--navy-hover);}
</style>
</head>
<body>
  <div class="logo">Scout<span>Mind</span></div>
  <h1 data-i18n="off.title">You're offline</h1>
  <p data-i18n="off.body">ScoutMind needs a connection for news, scores and the Scout Game. It will be here when you're back.</p>
  <button onclick="location.reload()" data-i18n="off.retry">Try again</button>
<script>if (typeof applyI18n === 'function') applyI18n();</script>
</body>
</html>
