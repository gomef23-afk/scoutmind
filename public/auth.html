<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://kdhbpzooyjxcglbxbuya.supabase.co; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://kdhbpzooyjxcglbxbuya.supabase.co;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>ScoutMind — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07090f;color:#edf2f7;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:#00e5a0;margin-bottom:6px;}
.logo span{color:#edf2f7;}
.tagline{font-size:13px;color:#5a6a85;margin-bottom:32px;}
.card{background:#0d1117;border:1px solid #1a2540;border-radius:16px;padding:32px;width:100%;max-width:420px;}
.tabs{display:flex;border-bottom:1px solid #1a2540;margin-bottom:24px;gap:0;}
.tab-btn{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:#5a6a85;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;transition:all .2s;}
.tab-btn.active{color:#00e5a0;border-bottom:2px solid #00e5a0;}
.form-section{display:none;}
.form-section.active{display:block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5a6a85;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;}
.field input{width:100%;background:#141b27;border:1px solid #1a2540;color:#edf2f7;padding:11px 14px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;}
.field input:focus{border-color:#00e5a0;}
.btn-primary{width:100%;background:#00e5a0;color:#000;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;}
.btn-primary:hover{background:#00ffb3;}
.divider{text-align:center;color:#5a6a85;font-size:12px;margin:14px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#1a2540;}
.divider::before{left:0;} .divider::after{right:0;}
.btn-demo{width:100%;background:transparent;border:1px solid #1a2540;color:#5a6a85;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-demo:hover{border-color:#5a6a85;color:#edf2f7;}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
.msg.error{background:rgba(255,69,96,0.1);border:1px solid rgba(255,69,96,0.3);color:#ff4560;}
.msg.success{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);color:#00e5a0;}
.back{text-align:center;margin-top:14px;font-size:12px;color:#5a6a85;cursor:pointer;}
.back:hover{color:#edf2f7;}
</style>
</head>
<body>

<div class="logo">Scout<span>Mind</span></div>
<div class="tagline">AI-powered football scouting platform</div>

<div class="card">
  <div class="tabs">
    <button class="tab-btn active" id="btn-login" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" id="btn-register" onclick="switchTab('register')">Create Account</button>
  </div>

  <div class="msg error" id="msg-error"></div>
  <div class="msg success" id="msg-success"></div>

  <!-- Shown when a session already exists. This page used to redirect to '/'
       instead, which raced against a sign-in already in flight. -->
  <div id="already-signed-in" style="display:none;background:rgba(0,229,160,0.07);border:1px solid rgba(0,229,160,0.3);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#c7d3e4;">
    Already signed in as <strong id="already-email"></strong>.
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      <a href="/" style="background:#00e5a0;color:#000;text-decoration:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:700;">Continue</a>
      <button onclick="signOutAndStay()" style="background:transparent;border:1px solid #2a3a52;color:#8fa3bf;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;">Sign out and use another account</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="form-section active" id="sec-login">
    <div class="field">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="your@email.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()" id="l-btn">Sign In</button>
    <div class="divider">or</div>
    <button class="btn-demo" onclick="doDemo()">👁 Preview as Demo User (no account needed)</button>
  </div>

  <!-- REGISTER -->
  <div class="form-section" id="sec-register">
    <div class="field">
      <label>Full name</label>
      <input type="text" id="r-name" placeholder="Your name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="r-email" placeholder="your@email.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="r-pass" placeholder="Min. 8 characters">
    </div>
    <button class="btn-primary" onclick="doRegister()" id="r-btn">Create Account</button>
    <div class="divider">or</div>
    <button class="btn-demo" onclick="doDemo()">👁 Preview as Demo User</button>
  </div>

  <div class="back" onclick="window.location.href='/'">← Back to scoutmind.app</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/sm_auth.js"></script>
<script>
var SURL = 'https://kdhbpzooyjxcglbxbuya.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaGJwem9veWp4Y2dsYnhidXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTEwNTMsImV4cCI6MjA5MzMyNzA1M30.mcflbqGij3Kzm_Ooe5yMw-fMUBWe25-y6TRiChFuekw';
var sb = supabase.createClient(SURL, SKEY);

// An existing session used to redirect straight to '/'. That was a race, and
// it is how one account's writes ended up on another account:
//
//   getSession() is async, so the form is usable before the redirect fires.
//   Type credentials, press Sign In, and the pending window.location.href='/'
//   navigates away MID sign-in — the new session never finishes persisting,
//   the old one survives in storage, and the app carries on as the previous
//   user while the nav shows the new one's name.
//
// So: no redirect. Say who is signed in and make switching explicit.
sb.auth.getSession().then(function (res) {
  var session = res && res.data && res.data.session;
  if (!session) return;
  var box = document.getElementById('already-signed-in');
  var who = document.getElementById('already-email');
  if (who) who.textContent = (session.user && session.user.email) || 'another account';
  if (box) box.style.display = 'block';
});

/**
 * End any existing session before starting a new one.
 *
 * scope 'local' on purpose: a global sign-out calls the server, and if that
 * call fails supabase-js can leave the local session in place — which is the
 * other half of the same bug. Local always clears storage, which is the part
 * that decides who the next request is sent as.
 */
async function clearExistingSession() {
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  if (window.SMAuth) { try { SMAuth.clearAccountCaches(); } catch (e) {} }
}

function signOutAndStay() {
  clearExistingSession().then(function () { window.location.reload(); });
}

// Check URL params
var params = new URLSearchParams(window.location.search);
if (params.get('tab') === 'signup') switchTab('register');

function switchTab(tab) {
  document.getElementById('sec-login').className = 'form-section' + (tab==='login'?' active':'');
  document.getElementById('sec-register').className = 'form-section' + (tab==='register'?' active':'');
  document.getElementById('btn-login').className = 'tab-btn' + (tab==='login'?' active':'');
  document.getElementById('btn-register').className = 'tab-btn' + (tab==='register'?' active':'');
  clearMsgs();
}

function showError(msg) {
  var el = document.getElementById('msg-error');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('msg-success').style.display = 'none';
}
function showSuccess(msg) {
  var el = document.getElementById('msg-success');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('msg-error').style.display = 'none';
}
function clearMsgs() {
  document.getElementById('msg-error').style.display = 'none';
  document.getElementById('msg-success').style.display = 'none';
}

function saveUser(id, email, name, userPlan) {
  // Drop every other account's scoped cache BEFORE writing this one. Signing in
  // here never cleared them, so a second account on the same browser started
  // life looking at the first account's clubs. Sign-out clears everything, but
  // sign-out is not guaranteed to have happened — a session can lapse, or a tab
  // can just be closed.
  if (window.SMAuth) {
    try { SMAuth.claimFor(id); } catch (e) {}
  }
  localStorage.setItem('sm_current_user', JSON.stringify({
    id: id, email: email, name: name, plan: userPlan || 'fan'
  }));
}

async function doLogin() {
  var email = document.getElementById('l-email').value.trim().slice(0,254);
  var pass = document.getElementById('l-pass').value.slice(0,128);
  if (!email || !pass) return showError('Please fill in all fields.');
  // Basic email format check
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');
  var btn = document.getElementById('l-btn');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  // Any previous session goes first, or signing in as a second account on this
  // browser leaves the first one's token in storage.
  await clearExistingSession();
  var res = await sb.auth.signInWithPassword({email: email, password: pass});
  if (res.error) {
    showError(res.error.message === 'Invalid login credentials' ? 'Wrong email or password.' : res.error.message);
    btn.textContent = 'Sign In'; btn.disabled = false;
    return;
  }
  // Prove the session in storage is the one we just created before handing over
  // to the app. If these disagree, the app would act as whoever the stored
  // session belongs to — silently, and with full write access to their data.
  var check = await sb.auth.getSession();
  var live = check && check.data && check.data.session;
  if (!live || !live.user || live.user.id !== res.data.user.id) {
    showError('Sign-in did not complete cleanly. Close other ScoutMind tabs and try again.');
    await clearExistingSession();
    btn.textContent = 'Sign In'; btn.disabled = false;
    return;
  }
  var profRes = await sb.from('profiles').select('*').eq('id', live.user.id).single();
  var prof = profRes.data;
  saveUser(live.user.id, live.user.email || email,
           prof ? prof.name : email.split('@')[0], prof ? prof.plan : 'fan');
  window.location.href = '/';
}

async function doRegister() {
  var name = document.getElementById('r-name').value.trim().slice(0,60);
  var email = document.getElementById('r-email').value.trim().slice(0,254);
  var pass = document.getElementById('r-pass').value.slice(0,128);
  if (!name || !email || !pass) return showError('Please fill in all fields.');
  // Validate name — no HTML/scripts
  if (/<|>|script/i.test(name)) return showError('Invalid characters in name.');
  // Validate email format
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');
  if (pass.length < 8) return showError('Password must be at least 8 characters.');
  // Require at least one number or special char in password
  if (!/[\d!@#$%^&*]/.test(pass)) return showError('Password must include at least one number or special character (!@#$%^&*).');
  var btn = document.getElementById('r-btn');
  btn.textContent = 'Creating account...'; btn.disabled = true;
  await clearExistingSession();
  var res = await sb.auth.signUp({email: email, password: pass, options: {data: {name: name, plan: 'fan'}}});
  if (res.error) {
    showError(res.error.message);
    btn.textContent = 'Create Account'; btn.disabled = false;
    return;
  }
  if (res.data.user) {
    // The profiles row is created server-side by the on_auth_user_created
    // trigger (see 002_public_read.sql) — required because email confirmation
    // means there is no session here, so this client write runs as `anon`.
    // Kept as a harmless fallback for the session-exists case.
    try {
      await sb.from('profiles').upsert({id: res.data.user.id, name: name, email: email, plan: 'fan', created_at: new Date().toISOString()});
    } catch (e) { /* trigger already handled it */ }
    saveUser(res.data.user.id, email, name, 'fan');
  }
  if (res.data.session) {
    window.location.href = '/';
  } else {
    showSuccess('Account created! Check your email to verify, then sign in.');
    btn.textContent = 'Create Account'; btn.disabled = false;
  }
}

function doDemo() {
  saveUser('demo', 'demo@scoutmind.app', 'Demo User', 'fan');
  window.location.href = '/';
}
</script>
</body>
</html>
