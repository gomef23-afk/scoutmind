<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoutMind — Communities</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--bg2:#0d1117;--bg3:#141b27;--accent:#00e5a0;--accent2:#00b8ff;--warn:#ff6b35;--text:#edf2f7;--muted:#5a6a85;--border:#1a2540;--red:#ff4560;--yellow:#f5c842;--green:#00e5a0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:rgba(7,9,15,0.97);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--accent);text-decoration:none;}
.logo span{color:var(--text);}
.main-nav-btn{background:transparent;border:none;color:var(--muted);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;border-bottom:2px solid transparent;text-decoration:none;display:inline-block;}
.main-nav-btn:hover{color:var(--text);}
.main-nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav-right{display:flex;align-items:center;gap:10px;}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;}
.plan-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(0,229,160,0.1);color:var(--accent);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s;}
.logout-btn:hover{border-color:var(--accent);color:var(--text);}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.page{max-width:1200px;margin:0 auto;padding:28px;}
.two-col{display:grid;grid-template-columns:300px 1fr;gap:20px;}
.team-selector{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;position:sticky;top:80px;}
.ts-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.ts-search{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit;outline:none;margin-bottom:10px;}
.ts-search:focus{border-color:var(--accent);}
.ts-team{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .2s;margin-bottom:2px;}
.ts-team:hover{background:rgba(255,255,255,0.04);}
.ts-team.active{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);}
.ts-team-name{font-size:13px;font-weight:500;}
.ts-team-league{font-size:10px;color:var(--muted);}
.ts-scroll{max-height:calc(100vh - 280px);overflow-y:auto;}
.league-select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;font-family:inherit;outline:none;margin-bottom:8px;}
.team-stats-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.tsm-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
.tsm-val{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.tsm-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.team-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.badge-style{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);color:var(--accent);}
.badge-warn{background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.2);color:var(--warn);}
.comm-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.comm-tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.comm-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.poll-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;}
.poll-question{font-size:15px;font-weight:600;margin-bottom:4px;}
.poll-meta{font-size:11px;color:var(--muted);margin-bottom:14px;}
.poll-option{margin-bottom:8px;cursor:pointer;}
.poll-option-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.poll-option-label{font-size:13px;font-weight:500;}
.poll-option-pct{font-size:12px;font-family:'DM Mono',monospace;color:var(--accent);}
.poll-bar-bg{height:6px;background:var(--border);border-radius:3px;}
.poll-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .6s ease;}
.poll-bar-fill.voted{background:var(--accent2);}
.poll-voted-badge{font-size:10px;color:var(--accent);margin-left:6px;}
.pf-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.pf-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-size:13px;font-family:inherit;outline:none;margin-bottom:10px;}
.pf-input:focus{border-color:var(--accent);}
.pf-btn{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.pf-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;margin-left:8px;}
.analyst-post{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;transition:border-color .2s;}
.analyst-post:hover{border-color:rgba(0,229,160,0.2);}
.analyst-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.analyst-av{width:40px;height:40px;border-radius:50%;background:rgba(0,184,255,0.12);border:1.5px solid rgba(0,184,255,0.3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent2);flex-shrink:0;}
.analyst-name{font-size:14px;font-weight:600;}
.analyst-credential{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(0,184,255,0.1);color:var(--accent2);border:1px solid rgba(0,184,255,0.2);}
.analyst-time{font-size:11px;color:var(--muted);}
.analyst-body{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;}
.analyst-reactions{display:flex;gap:8px;}
.react-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;color:var(--text);}
.react-btn:hover{border-color:var(--accent);background:rgba(0,229,160,0.06);}
.group-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;margin-bottom:10px;}
.group-card:hover{border-color:rgba(0,229,160,0.3);transform:translateX(3px);}
.group-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.15);}
.group-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.group-desc{font-size:11px;color:var(--muted);}
.group-chat-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:400;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.group-chat-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(660px,95vw);height:min(680px,90vh);display:flex;flex-direction:column;overflow:hidden;}
.group-chat-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.group-chat-title{font-size:16px;font-weight:600;flex:1;}
.group-chat-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.group-chat-close:hover{color:var(--text);}
.group-chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.gchat-msg{display:flex;gap:10px;}
.gchat-av{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--accent);}
.gchat-user{font-size:12px;font-weight:600;}
.gchat-time{font-size:10px;color:var(--muted);margin-left:6px;}
.gchat-text{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px;}
.group-chat-input-row{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;}
.gchat-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;font-family:inherit;outline:none;transition:border .2s;}
.gchat-input:focus{border-color:var(--accent);}
.gchat-send{background:var(--accent);color:#000;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.wish-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
.wish-rank{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted);min-width:36px;line-height:1;}
.wish-rank.top{color:var(--accent);}
.wish-info{flex:1;}
.wish-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.wish-meta{font-size:11px;color:var(--muted);}
.wish-vote-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.wish-vote-btn:hover,.wish-vote-btn.voted{border-color:var(--accent);color:var(--accent);background:rgba(0,229,160,0.06);}
.wish-count{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;}
.pro-gate{background:linear-gradient(135deg,rgba(0,229,160,0.06),rgba(0,184,255,0.04));border:1px solid rgba(0,229,160,0.15);border-radius:10px;padding:16px;text-align:center;margin-top:10px;}
.pro-gate-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.pro-gate-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.upgrade-btn{background:var(--accent);color:#000;border:none;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:24px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.two-col{grid-template-columns:1fr;}.team-selector{position:static;}.ts-scroll{max-height:200px;}.team-stats-mini{grid-template-columns:repeat(2,1fr);}nav{padding:12px 16px;}.page{padding:14px;}}
</style>
</head>
<body>
<script>
const _cu = JSON.parse(localStorage.getItem('sm_current_user') || 'null');
if (!_cu) window.location.href = '/auth.html';
</script>

<nav>
  <div style="display:flex;align-items:center;">
    <a class="logo" href="/app.html">Scout<span>Mind</span></a>
    <div style="display:flex;gap:2px;margin-left:28px;">
      <a class="main-nav-btn" href="/app.html">Scout Mode</a>
      <a class="main-nav-btn" href="/app.html?page=feed">Feed</a>
      <a class="main-nav-btn active" href="/community.html">Communities</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="user-badge" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <span class="live-dot"></span>
      <span id="nav-name" style="font-size:12px;font-weight:500"></span>
      <span id="nav-plan" class="plan-pill"></span>
    </div>
    <div id="nav-avatar" onclick="window.location.href='/app.html'" style="width:32px;height:32px;border-radius:50%;background:rgba(0,229,160,0.15);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;flex-shrink:0;">?</div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="page">
  <div style="margin-bottom:20px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;margin-bottom:4px">Communities</div>
    <div style="font-size:13px;color:var(--muted)">Pick your team. Read analyst insights. Chat in groups. Vote on transfers.</div>
  </div>
  <div class="two-col">
    <div>
      <div class="team-selector">
        <div class="ts-title">Find Your Club</div>
        <select class="league-select" id="comm-league" onchange="loadLeagueTeams()">
          <option value="serie_a">🇧🇷 Série A</option>
          <option value="serie_b">🇧🇷 Série B</option>
          <option value="premier_league">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
          <option value="la_liga">🇪🇸 La Liga</option>
          <option value="bundesliga">🇩🇪 Bundesliga</option>
          <option value="serie_a_it">🇮🇹 Serie A Italy</option>
          <option value="ligue_1">🇫🇷 Ligue 1</option>
          <option value="argentina">🇦🇷 Argentina</option>
          <option value="mls">🇺🇸 MLS</option>
          <option value="saudi_pro">🇸🇦 Saudi Pro League</option>
          <option value="eredivisie">🇳🇱 Eredivisie</option>
          <option value="primeira_liga">🇵🇹 Primeira Liga</option>
        </select>
        <input type="text" class="ts-search" id="comm-search" placeholder="Search teams..." oninput="filterCommTeams()">
        <div class="ts-scroll" id="comm-team-list"></div>
      </div>
    </div>
    <div id="comm-main">
      <div class="empty">
        <div style="font-size:40px;margin-bottom:16px;opacity:0.3">👥</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;opacity:.35;margin-bottom:6px">Select Your Club</div>
        <div style="font-size:13px">Pick a team from the left to see their community</div>
      </div>
    </div>
  </div>
</div>

<!-- GROUP CHAT OVERLAY -->
<div id="group-chat-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:400;align-items:center;justify-content:center;backdrop-filter:blur(8px);">
  <div class="group-chat-modal">
    <div class="group-chat-header">
      <div id="gchat-icon" style="font-size:22px;">💬</div>
      <div style="flex:1">
        <div class="group-chat-title" id="gchat-name">Group</div>
        <div id="gchat-desc" style="font-size:11px;color:var(--muted)"></div>
      </div>
      <button class="group-chat-close" onclick="closeGroupChat()">✕</button>
    </div>
    <div class="group-chat-messages" id="gchat-messages"><div class="spinner"></div></div>
    <div id="gchat-input-wrap" class="group-chat-input-row">
      <input class="gchat-input" id="gchat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendGroupMessage()">
      <button class="gchat-send" onclick="sendGroupMessage()">Send</button>
    </div>
  </div>
</div>

<script>
// SUPABASE
const _sb = window.supabase.createClient(
  'https://kdhbpzooyjxcglbxbuya.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaGJwem9veWp4Y2dsYnhidXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTEwNTMsImV4cCI6MjA5MzMyNzA1M30.mcflbqGij3Kzm_Ooe5yMw-fMUBWe25-y6TRiChFuekw'
);

// AUTH
const cu = JSON.parse(localStorage.getItem('sm_current_user') || 'null');
const PLAN_NAMES = {free:'Scout Free',pro:'Scout Pro',club:'Club Basic',clubpro:'Club Pro',analyst:'Analyst'};
const isPro = cu && ['pro','club','clubpro','analyst'].includes(cu.plan);
const isAnalyst = cu && cu.plan === 'analyst';
if(cu){
  const name = cu.name || cu.email?.split('@')[0] || 'User';
  document.getElementById('nav-name').textContent = name;
  document.getElementById('nav-plan').textContent = PLAN_NAMES[cu.plan] || 'Scout Free';
  const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const av = document.getElementById('nav-avatar');
  if(av) av.textContent = initials;
}
function logout(){ localStorage.removeItem('sm_current_user'); window.location.href='/auth.html'; }

// STATE
let activeTeam=null, activeLeague='serie_a', activeCommTab='polls';
let activeGroupId=null, gchatPoll=null;
const GROUP_ICONS=['🔴','💚','⚫','⭐','🔵','🟡','🔥','💪','🏆','🦁'];

// TEAM LIST
function loadLeagueTeams(){ activeLeague=document.getElementById('comm-league').value; filterCommTeams(); }
function filterCommTeams(){
  const q=document.getElementById('comm-search').value.toLowerCase();
  const teams=(TEAMS[activeLeague]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const filtered=q?teams.filter(t=>t.name.toLowerCase().includes(q)):teams;
  const isActive=(t)=>activeTeam&&(t.id===activeTeam.id||t.name===activeTeam.name);
  document.getElementById('comm-team-list').innerHTML=filtered.length===0
    ?'<div style="font-size:12px;color:var(--muted);padding:8px;text-align:center">No teams found</div>'
    :filtered.map(t=>`<div class="ts-team ${isActive(t)?'active ':\''}" onclick="selectCommTeam(${JSON.stringify(t.id||'')},'${t.name.replace(/'/g,'\\'')}','${activeLeague}')"><div><div class="ts-team-name">${t.name}</div><div class="ts-team-league">${t.pos||''}</div></div><div style="font-size:10px;color:var(--muted)">›</div></div>`).join('');
}
function selectCommTeam(teamId,teamName,league){
  const teams=TEAMS[league]||[];
  activeTeam=teams.find(t=>t.id===teamId)||teams.find(t=>t.name===teamName);
  activeLeague=league;
  if(!activeTeam)return;
  filterCommTeams();
  renderTeamPage();
}

// TEAM PAGE
function renderTeamPage(){
  if(!activeTeam)return;
  const t=activeTeam;
  const tk=t.id||(t.name.toLowerCase().replace(/\s+/g,'_'));
  const av=LEAGUE_AVGS[activeLeague]||{};
  const info=(typeof TEAM_INFO!=='undefined'&&(TEAM_INFO[tk]||TEAM_INFO[t.id]))||{};
  const coach=(typeof COACHES!=='undefined'&&(COACHES[tk]||COACHES[t.id]))||{};
  const ini=t.name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const badges=[];
  if(t.pos_pct>(av.pos||50)+5)badges.push({txt:'High Possession',cls:'badge-style'});
  if(t.tk>(av.tk||18)+1)badges.push({txt:'High Press',cls:'badge-warn'});
  if(t.gs>(av.gs||1.3)+0.2)badges.push({txt:'Strong Attack',cls:'badge-style'});
  if(t.gc<(av.gc||1.3)-0.15)badges.push({txt:'Solid Defence',cls:'badge-style'});
  const v=[];
  if(t.gc>(av.gc||1.3)*1.2)v.push('defensive errors are a concern');
  if(t.gs<(av.gs||1.3)*0.85)v.push('attacking output is below average');
  if(t.aer<(av.aer||51)*0.9)v.push('aerial vulnerability at set pieces');
  const verdict=v.length>0?`ScoutMind identifies ${v.slice(0,2).join(' and ')} as priority areas.`:`${t.name} are performing well across all key metrics this season.`;
  document.getElementById('comm-main').innerHTML=`
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;">
      <div style="height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div>
      <div style="padding:20px 22px;">
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:16px;">
          <div style="width:64px;height:64px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text)">${ini}</div></div>
          <div style="flex:1">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:4px">${info.fullName||t.name}</div>

function switchCommTab(tab,el){
  activeCommTab=tab;
  document.querySelectorAll('.comm-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCommTab();
}
function renderCommTab(){
  const el=document.getElementById('comm-tab-content');
  if(!el||!activeTeam)return;
  const tk=activeTeam.id||(activeTeam.name.toLowerCase().replace(/\s+/g,'_'));
  if(activeCommTab==='polls')renderPolls(el,tk);
  else if(activeCommTab==='analyst')renderAnalystInsights(el,tk);
  else if(activeCommTab==='groups')renderGroups(el,tk);
  else if(activeCommTab==='wishlist')renderWishlist(el,tk);
}

function renderPolls(el,tk){
  const d=getTD(tk); let html='';
  if(isPro){html+=`<button onclick="togglePF()" style="width:100%;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:12px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:12px;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">+ Create a Poll</button><div id="poll-form" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;"><div class="pf-label">Poll question</div><input class="pf-input" id="pf-q" placeholder="e.g. Who should we sign?"><div class="pf-label">Option 1</div><input class="pf-input" id="pf-o1" placeholder="Option A"><div class="pf-label">Option 2</div><input class="pf-input" id="pf-o2" placeholder="Option B"><div class="pf-label">Option 3 (optional)</div><input class="pf-input" id="pf-o3" placeholder="Option C"><button class="pf-btn" onclick="submitPoll('${tk}')">Create Poll</button><button class="pf-cancel" onclick="togglePF()">Cancel</button></div>`;}
  else{html+=`<div class="pro-gate" style="margin-bottom:12px"><div class="pro-gate-title">Create Polls with Scout Pro</div><div class="pro-gate-sub">Scout Pro members can create polls for any team.</div><button class="upgrade-btn" onclick="window.location.href='/auth.html'">Upgrade — $9.99/mo</button></div>`;}
  d.polls.forEach(p=>{

    html+=`<div class="poll-card"><div class="poll-question">${p.q}</div><div class="poll-meta">by ${p.author} · ${p.time} · ${tot} votes</div>${p.opts.map((o,i)=>{const pct=tot>0?Math.round(p.votes[i]/tot*100):0;const v=p.userVote===i;return`<div class="poll-option" onclick="doVote('${tk}','${p.id}',${i})"><div class="poll-option-row"><div class="poll-option-label">${o}${v?'<span class="poll-voted-badge">✓ Your vote</span>':''}</div><div class="poll-option-pct">${pct}%</div></div><div class="poll-bar-bg"><div class="poll-bar-fill ${v?'voted ':\''}" style="width:${pct}%"></div></div></div>`;}).join('')}</div>`;

function togglePF(){const f=document.getElementById('poll-form');if(f)f.style.display=f.style.display==='none'?'block':'none';}
function submitPoll(tk){const q=document.getElementById('pf-q').value.trim();const o1=document.getElementById('pf-o1').value.trim();const o2=document.getElementById('pf-o2').value.trim();const o3=document.getElementById('pf-o3').value.trim();if(!q||!o1||!o2){alert('Please fill in the question and at least 2 options.');return;}const d=getTD(tk);const opts=[o1,o2,...(o3?[o3]:[])];d.polls.unshift({id:'p'+Date.now(),q,opts,votes:opts.map(()=>0),userVote:null,author:cu.name||'Fan',time:'just now'});saveTD(tk,d);renderCommTab();}
function doVote(tk,pid,idx){const d=getTD(tk);const p=d.polls.find(x=>x.id===pid);if(!p||p.userVote!==null)return;p.votes[idx]++;p.userVote=idx;saveTD(tk,d);renderCommTab();}

async function postInsight(tk){
  const input=document.getElementById('analyst-input');
  const content=input?.value?.trim();
  if(!content)return;
  const {data:prof}=await _sb.from('profiles').select('credential').eq('id',cu.id).single();

  const {error}=await _sb.from('analyst_posts').insert({team_id:tk,user_id:cu.id,user_name:cu.name||cu.email?.split('@')[0]||'Analyst',credential,content});
  if(error){alert('Error posting. Please try again.');return;}
  renderCommTab();
}
async function reactPost(postId,reaction){
  const {data:p}=await _sb.from('analyst_posts').select('reactions').eq('id',postId).single();
  if(!p)return;
  const r=p.reactions||{fire:0,clap:0,mind_blown:0};
  r[reaction]=(r[reaction]||0)+1;
  await _sb.from('analyst_posts').update({reactions:r}).eq('id',postId);
  renderCommTab();
}

    const ini=m.user_name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    return `<div class="gchat-msg" style="${me?'flex-direction:row-reverse':''}">

        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;${me?'flex-direction:row-reverse':''}"><span class="gchat-user">${me?'You':m.user_name}</span><span class="gchat-time">${formatAgo(m.created_at)}</span></div>
        <div class="gchat-text" style="background:${me?'rgba(0,229,160,0.08)':'var(--bg3)'};padding:8px 12px;border-radius:${me?'12px 4px 12px 12px':'4px 12px 12px 12px'};display:inline-block;max-width:80%">${m.content}</div>
      </div>
    </div>`;
  }).join('');
  if(atBot)el.scrollTop=el.scrollHeight;
}
async function sendGroupMessage(){
  if(!activeGroupId||!isPro)return;

}

function wishVote(tk,i){const d=getTD(tk);const s=[...d.wishlist].sort((a,b)=>b.votes-a.votes);const p=s[i];if(!p)return;const o=d.wishlist.find(x=>x.name===p.name);if(!o||o.userVoted)return;o.votes++;o.userVoted=true;saveTD(tk,d);renderCommTab();}
function addWish(tk){const n=document.getElementById('wn')?.value?.trim();const c=document.getElementById('wc')?.value?.trim();const p=document.getElementById('wp')?.value?.trim();if(!n||!c)return;const d=getTD(tk);d.wishlist.push({name:n,club:c,pos:p||'???',votes:1,userVoted:true});saveTD(tk,d);renderCommTab();}

// UTILS
function formatAgo(iso){
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60)return'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

// INIT
const _mc=JSON.parse(localStorage.getItem('sm_main_club')||'null');
const CLM={flamengo:'serie_a',palmeiras:'serie_a',corinthians:'serie_a',botafogo:'serie_a',fluminense:'serie_a',atletico_mg:'serie_a',gremio:'serie_a',internacional:'serie_a',sao_paulo:'serie_a',cruzeiro:'serie_a',bahia:'serie_a',athletico_pr:'serie_a',real_madrid:'la_liga',barcelona:'la_liga',atletico_madrid:'la_liga',man_city:'premier_league',arsenal:'premier_league',liverpool:'premier_league',man_utd:'premier_league',chelsea:'premier_league',bayern:'bundesliga',dortmund:'bundesliga',leverkusen:'bundesliga',psg:'ligue_1',juventus:'serie_a_it',inter:'serie_a_it',milan:'serie_a_it',napoli:'serie_a_it',river:'argentina',boca:'argentina'};
function init(){
  if(_mc){
    let lg=CLM[_mc.id];
    if(!lg&&_mc.league){const l=_mc.league.toLowerCase();if(l.includes('série a')||l.includes('serie a'))lg='serie_a';else if(l.includes('premier'))lg='premier_league';else if(l.includes('la liga'))lg='la_liga';else if(l.includes('bundesliga'))lg='bundesliga';else if(l.includes('ligue'))lg='ligue_1';else if(l.includes('serie a it'))lg='serie_a_it';else if(l.includes('argentina'))lg='argentina';}
    lg=lg||'serie_a';
    const sel=document.getElementById('comm-league');
    if(sel)sel.value=lg;
    activeLeague=lg;
    loadLeagueTeams();
    selectCommTeam(_mc.id||'',_mc.name||'',lg);
  } else {
    loadLeagueTeams();
    document.getElementById('comm-main').innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;"><div style="font-size:40px;margin-bottom:16px;opacity:0.4">👥</div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:8px;">Choose Your Club</div><div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">Pick a team from the left, or set your main club so it loads automatically every time.</div><button onclick="window.location.href='/app.html'" style="background:var(--accent);color:#000;border:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;">Set My Main Club</button></div>`;
  }
}
if(typeof TEAMS!=='undefined'){init();}else{window.addEventListener('load',init);}
</script>
</body>
</html>
