<!DOCTYPE html>
<!-- Source for the PNG app icons. scripts/make-icons.ps1 screenshots this page
     with headless Edge at each size. ?shape=round draws the favicon's rounded
     square; the default is a full square, because iOS and Android round app
     icons themselves (and a pre-rounded icon gets dark corners). The monogram
     is the same strokes as public/favicon.svg, scaled to sit inside the
     maskable safe zone (the middle 80%). -->
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#07090f;overflow:hidden;}
  svg{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<svg id="i" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet"></svg>
<script>
  var round = /shape=round/.test(location.search);
  var svg = document.getElementById('i');
  svg.innerHTML = round
    ? '<rect width="64" height="64" rx="14" fill="#07090f"/>'
      + '<rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1a2540" stroke-width="2"/>'
      + '<path d="M27 25V19H13V32H27V45H13V39" fill="none" stroke="#00e5a0" stroke-width="6"/>'
      + '<path d="M37 48V19L45 31L53 19V48" fill="none" stroke="#edf2f7" stroke-width="6"/>'
    : '<rect width="64" height="64" fill="#07090f"/>'
      + '<g transform="translate(32 32) scale(0.82) translate(-32 -32)">'
      + '<path d="M27 25V19H13V32H27V45H13V39" fill="none" stroke="#00e5a0" stroke-width="6"/>'
      + '<path d="M37 48V19L45 31L53 19V48" fill="none" stroke="#edf2f7" stroke-width="6"/>'
      + '</g>';
</script>
</body>
</html>
