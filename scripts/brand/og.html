<!DOCTYPE html>
<!-- Source for public/og.png (1200x630), the link-preview image. Rendered by
     scripts/make-icons.ps1 with headless Edge. No numbers on it: about.html's
     rule (CLAUDE.md 22) applies to anything we show strangers. -->
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#07090f;font-family:'DM Sans',sans-serif;color:#edf2f7;}
  .wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:84px 96px;
    background:radial-gradient(900px 500px at 85% 15%,rgba(0,229,160,0.13),transparent 60%),
               radial-gradient(700px 420px at 10% 95%,rgba(0,184,255,0.08),transparent 60%),#07090f;}
  .mark{width:132px;height:132px;}
  .word{font-family:'Bebas Neue',sans-serif;font-size:132px;letter-spacing:10px;line-height:1;margin-top:40px;color:#00e5a0;}
  .word span{color:#edf2f7;}
  .line{font-size:40px;font-weight:600;margin-top:18px;}
  .sub{font-size:26px;color:#8fa3bf;margin-top:16px;}
  .url{position:absolute;right:96px;bottom:72px;font-size:24px;color:#5a6a85;letter-spacing:1px;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#00e5a0,#00b8ff);}
</style>
</head>
<body>
<div class="wrap">
  <svg class="mark" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#0d1117"/>
    <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1a2540" stroke-width="2"/>
    <path d="M27 25V19H13V32H27V45H13V39" fill="none" stroke="#00e5a0" stroke-width="6"/>
    <path d="M37 48V19L45 31L53 19V48" fill="none" stroke="#edf2f7" stroke-width="6"/>
  </svg>
  <div class="word">Scout<span>Mind</span></div>
  <div class="line">Your club. Everything around it.</div>
  <div class="sub">The free football social network · news, club rooms, matches and the Scout Game</div>
  <div class="url">scoutmind.app</div>
  <div class="bar"></div>
</div>
</body>
</html>
